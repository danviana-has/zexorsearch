<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GM Search AI - Resultados</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .cursor-blink::after {
            content: '▌';
            animation: blink 1s step-start infinite;
            color: #2563eb;
        }
        @keyframes blink { 50% { opacity: 0; } }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 font-sans min-h-screen flex flex-col">

    <!-- Topbar Fixa no Estilo Microsoft/Google -->
    <header class="bg-white border-b border-gray-200 sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-6 py-3 flex items-center justify-between">
            
            <div class="flex items-center space-x-6 flex-grow max-w-3xl">
                <!-- Logo clicável -->
                <div class="flex items-center space-x-2 cursor-pointer flex-shrink-0" onclick="window.location.href='index.html'">
                    <div class="w-8 h-8 bg-blue-600 text-white font-bold rounded-lg flex items-center justify-center text-base">
                        GM
                    </div>
                </div>

                <!-- Barra de Busca no Topo -->
                <form onsubmit="executarNovaPesquisa(event)" class="w-full">
                    <div class="bg-gray-50 rounded-full border border-gray-300 px-4 py-2 flex items-center shadow-inner focus-within:bg-white focus-within:border-blue-500 transition">
                        <svg class="h-4 w-4 text-gray-400 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                        </svg>
                        <input type="text" id="top-search-input" class="w-full text-sm text-gray-900 focus:outline-none bg-transparent">
                    </div>
                </form>
            </div>

            <!-- Menu de Apps Superior Direito -->
            <div class="relative ml-4">
                <button id="apps-btn" onclick="toggleAppsMenu()" class="p-2 hover:bg-gray-100 rounded-full transition">
                    <svg class="w-6 h-6 text-gray-600" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M6 10c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm12 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm-6 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0-6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 12c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm-6 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm12 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0-12c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm-6 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/>
                    </svg>
                </button>
                <div id="apps-menu" class="hidden absolute right-0 mt-2 w-72 bg-white border border-gray-200 rounded-2xl shadow-xl p-4 z-50 grid grid-cols-3 gap-3 text-center">
                    <a href="https://ecosystem.gmcorporation.com.br" target="_blank" class="p-3 hover:bg-gray-50 rounded-xl flex flex-col items-center"><div class="w-8 h-8 bg-indigo-50 text-indigo-600 rounded-lg flex items-center justify-center font-bold mb-1">🌐</div><span class="text-xs">Ecosystem</span></a>
                    <a href="https://email.gmcorporation.com.br" target="_blank" class="p-3 hover:bg-gray-50 rounded-xl flex flex-col items-center"><div class="w-8 h-8 bg-emerald-50 text-emerald-600 rounded-lg flex items-center justify-center font-bold mb-1">🆔</div><span class="text-xs">Central</span></a>
                    <a href="https://zexor.gmcorporation.com.br" target="_blank" class="p-3 hover:bg-gray-50 rounded-xl flex flex-col items-center"><div class="w-8 h-8 bg-blue-50 text-blue-600 rounded-lg flex items-center justify-center font-bold mb-1">⚡</div><span class="text-xs">Zexor AI</span></a>
                </div>
            </div>
        </div>

        <!-- Abas de Filtros (Padrão do Print enviado) -->
        <div class="max-w-7xl mx-auto px-6 flex space-x-6 text-xs font-semibold uppercase tracking-wider text-gray-500 border-t border-gray-100 pt-2 pb-1">
            <span class="text-blue-600 border-b-2 border-blue-600 pb-2 cursor-pointer">Tudo</span>
            <span class="hover:text-gray-800 cursor-pointer pb-2">Pesquisar</span>
            <span class="hover:text-gray-800 cursor-pointer pb-2">Imagens</span>
            <span class="hover:text-gray-800 cursor-pointer pb-2">Vídeos</span>
            <span class="hover:text-gray-800 cursor-pointer pb-2 text-purple-600 font-bold flex items-center gap-1">⚡ Zexor AI</span>
        </div>
    </header>

    <!-- Conteúdo Principal dos Resultados -->
    <main class="max-w-4xl px-6 py-6 flex-grow space-y-6">
        
        <div id="status-message" class="text-xs text-gray-500">Iniciando consulta...</div>

        <!-- Card Sintetizado pela Zexor AI em Tempo Real -->
        <div id="ai-card" class="bg-white border border-blue-100 rounded-2xl p-6 shadow-sm hidden">
            <div class="flex items-center space-x-2 mb-3">
                <span id="ai-pulse" class="w-2.5 h-2.5 rounded-full bg-blue-600 animate-pulse"></span>
                <h3 class="text-xs font-bold text-blue-900 uppercase tracking-wider">Síntese Inteligente (Zexor AI)</h3>
            </div>
            <p id="ai-text" class="text-gray-800 text-sm leading-relaxed whitespace-pre-line cursor-blink"></p>
        </div>

        <!-- Lista de Resultados Web Orgânicos -->
        <div id="results-list" class="space-y-5"></div>
    </main>

    <script>
        const BACKEND_URL = "https://search-api.gmcorporation.com.br";

        // Toggle do Menu de Apps
        function toggleAppsMenu() {
            document.getElementById('apps-menu').classList.toggle('hidden');
        }

        // Lê o parâmetro 'q' da URL da página
        function obterQueryUrl() {
            const params = new URLSearchParams(window.location.search);
            return params.get('q') || '';
        }

        async function processarBuscaStreaming(query) {
            if (!query) return;

            document.getElementById('top-search-input').value = query;

            const resultsList = document.getElementById('results-list');
            const statusMessage = document.getElementById('status-message');
            const aiCard = document.getElementById('ai-card');
            const aiText = document.getElementById('ai-text');
            const aiPulse = document.getElementById('ai-pulse');

            resultsList.innerHTML = '';
            aiCard.classList.add('hidden');
            aiText.innerText = '';
            aiText.classList.add('cursor-blink');
            aiPulse.classList.add('animate-pulse');
            
            statusMessage.innerText = "Consultando indexadores da web...";

            try {
                const response = await fetch(`${BACKEND_URL}/api/search`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query: query })
                });

                const reader = response.body.getReader();
                const decoder = new TextDecoder("utf-8");
                let buffer = "";

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split("\n\n");
                    buffer = lines.pop();

                    for (const line of lines) {
                        if (line.startsWith("data: ")) {
                            const rawData = line.replace("data: ", "").trim();
                            if (!rawData) continue;

                            const data = JSON.parse(rawData);

                            // Evento 1: Renderiza os links web imediatamente no layout da imagem
                            if (data.type === "results") {
                                statusMessage.innerText = `Aproximadamente ${data.results.length} resultados encontrados:`;
                                
                                data.results.forEach((item, index) => {
                                    const card = `
                                        <div class="bg-white p-5 rounded-xl border border-gray-200 hover:shadow-md transition">
                                            <div class="flex items-center space-x-2 text-xs text-gray-500 mb-1">
                                                <span class="w-4 h-4 rounded-full bg-gray-100 flex items-center justify-center font-bold text-[10px] text-gray-600">${index + 1}</span>
                                                <span class="text-green-700 font-medium truncate">${item.href}</span>
                                            </div>
                                            <a href="${item.href}" target="_blank" class="text-lg text-blue-700 font-semibold hover:underline block mb-1">
                                                ${item.title}
                                            </a>
                                            <p class="text-xs text-gray-600 leading-relaxed">${item.body}</p>
                                        </div>
                                    `;
                                    resultsList.insertAdjacentHTML('beforeend', card);
                                });

                                aiCard.classList.remove('hidden');
                            }

                            // Evento 2: Digita os caracteres da Zexor AI no topo
                            if (data.type === "ai_chunk") {
                                aiText.innerText += data.content;
                            }

                            // Evento 3: Finaliza
                            if (data.type === "done") {
                                aiText.classList.remove('cursor-blink');
                                aiPulse.classList.remove('animate-pulse');
                            }
                        }
                    }
                }

            } catch (err) {
                statusMessage.innerHTML = `<span class="text-red-500">Erro ao comunicar com a Zexor AI. Certifique-se de que o backend Python e o Cloudflared estão ativos.</span>`;
            }
        }

        function executarNovaPesquisa(e) {
            e.preventDefault();
            const q = document.getElementById('top-search-input').value.trim();
            if (q) {
                window.history.pushState({}, '', `search.html?q=${encodeURIComponent(q)}`);
                processarBuscaStreaming(q);
            }
        }

        // Executa a pesquisa ao carregar a página search.html
        window.addEventListener('DOMContentLoaded', () => {
            const queryInicial = obterQueryUrl();
            if (queryInicial) {
                processarBuscaStreaming(queryInicial);
            }
        });
    </script>
</body>
</html>
