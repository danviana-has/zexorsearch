<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GM Search AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .gm-brand { font-family: system-ui, -apple-system, sans-serif; }
    </style>
</head>
<body class="bg-white text-gray-900 font-sans min-h-screen flex flex-col justify-between">

    <!-- Topbar superior -->
    <header class="w-full px-6 py-4 flex justify-between items-center relative">
        <!-- Ícone / Logo GM Search -->
        <div class="flex items-center space-x-3 cursor-pointer" onclick="window.location.href='index.html'">
            <div class="w-9 h-9 bg-blue-600 text-white font-bold rounded-lg flex items-center justify-center text-lg shadow-sm">
                GM
            </div>
            <span class="font-semibold text-lg tracking-tight text-gray-800">GM Search AI</span>
        </div>

        <!-- Botão Grid de Apps (Google Apps Launcher Style) -->
        <div class="relative">
            <button id="apps-btn" onclick="toggleAppsMenu()" class="p-2.5 hover:bg-gray-100 rounded-full transition focus:outline-none">
                <svg class="w-6 h-6 text-gray-600" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M6 10c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm12 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm-6 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0-6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 12c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm-6 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm12 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0-12c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm-6 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/>
                </svg>
            </button>

            <!-- Dropdown Menu de Ecossistemas GM -->
            <div id="apps-menu" class="hidden absolute right-0 mt-3 w-72 bg-white border border-gray-200 rounded-2xl shadow-xl p-4 z-50 grid grid-cols-3 gap-3 text-center">
                
                <a href="https://ecosystem.gmcorporation.com.br" target="_blank" class="p-3 hover:bg-gray-50 rounded-xl transition flex flex-col items-center">
                    <div class="w-10 h-10 bg-indigo-50 text-indigo-600 rounded-xl flex items-center justify-center font-bold mb-1">
                        🌐
                    </div>
                    <span class="text-xs text-gray-700 font-medium">Ecosystem</span>
                </a>

                <a href="https://email.gmcorporation.com.br" target="_blank" class="p-3 hover:bg-gray-50 rounded-xl transition flex flex-col items-center">
                    <div class="w-10 h-10 bg-emerald-50 text-emerald-600 rounded-xl flex items-center justify-center font-bold mb-1">
                        🆔
                    </div>
                    <span class="text-xs text-gray-700 font-medium">Central</span>
                </a>

                <a href="https://zexor.gmcorporation.com.br" target="_blank" class="p-3 hover:bg-gray-50 rounded-xl transition flex flex-col items-center">
                    <div class="w-10 h-10 bg-blue-50 text-blue-600 rounded-xl flex items-center justify-center font-bold mb-1">
                        ⚡
                    </div>
                    <span class="text-xs text-gray-700 font-medium">Zexor AI</span>
                </a>

            </div>
        </div>
    </header>

    <!-- Centro: Saudação Temporal + Barra de Busca -->
    <main class="flex-grow flex flex-col items-center justify-center px-4 -mt-12">
        <div class="text-center mb-6">
            <h2 id="greeting-text" class="text-3xl font-light text-gray-600 mb-2"></h2>
            <h1 class="text-5xl font-extrabold tracking-tight text-gray-900 gm-brand">
                GM Search AI
            </h1>
        </div>

        <form onsubmit="executarPesquisa(event)" class="w-full max-w-2xl">
            <div class="bg-white rounded-full border border-gray-200 pl-6 pr-4 py-3.5 flex items-center shadow-sm hover:shadow-md focus-within:shadow-md focus-within:border-gray-300 transition duration-200">
                <svg class="h-5 w-5 text-gray-400 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                </svg>
                <input type="text" id="query-input" autofocus placeholder="Pesquise no mundo com inteligência local..." class="w-full text-base text-gray-900 focus:outline-none bg-transparent">
                <button type="submit" class="bg-blue-600 text-white p-2 rounded-full hover:bg-blue-700 transition">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
                </button>
            </div>
        </form>
    </main>

    <!-- Rodapé -->
    <footer class="bg-gray-50 text-gray-500 text-xs py-4 px-6 border-t border-gray-200 w-full flex justify-between">
        <div>GM Search AI &copy; 2026 | GM Corporation</div>
        <div>Recife, Pernambuco, BR</div>
    </footer>

    <script>
        // Saudação dinâmica baseada no relógio
        function atualizarSaudacao() {
            const hora = new Date().getHours();
            const greetingEl = document.getElementById('greeting-text');
            if (hora >= 5 && hora < 12) {
                greetingEl.innerText = "Bom Dia";
            } else if (hora >= 12 && hora < 18) {
                greetingEl.innerText = "Boa Tarde";
            } else {
                greetingEl.innerText = "Boa Noite";
            }
        }
        atualizarSaudacao();

        // Toggle do Menu de Apps
        function toggleAppsMenu() {
            const menu = document.getElementById('apps-menu');
            menu.classList.toggle('hidden');
        }

        // Fechar o menu se clicar fora
        document.addEventListener('click', (e) => {
            const btn = document.getElementById('apps-btn');
            const menu = document.getElementById('apps-menu');
            if (!btn.contains(e.target) && !menu.contains(e.target)) {
                menu.classList.add('hidden');
            }
        });

        // Redireciona para search.html enviando o parâmetro da busca na URL
        function executarPesquisa(e) {
            e.preventDefault();
            const query = document.getElementById('query-input').value.trim();
            if (query) {
                window.location.href = `search.html?q=${encodeURIComponent(query)}`;
            }
        }
    </script>
</body>
</html>
